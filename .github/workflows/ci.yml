name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deployment stays manual (`npm run deploy`, gh-pages -d dist). This workflow
# only checks that what landed on main still lints and builds.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the version the lock file is generated with locally; a
          # mismatch is what let package-lock.json drift out of sync with
          # package.json unnoticed until this workflow first ran.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
