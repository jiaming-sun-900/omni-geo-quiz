<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so the fixed corner
         controls can clear the iPhone notch / home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF7F4" />
    <link rel="icon" type="image/svg+xml" href="/omni-geo-quiz/favicon.svg" />

    <title>Omni Geo Quiz</title>
    <meta
      name="description"
      content="A geography quiz built with React, D3 and Three.js: find US states, cities and airports on a blank map, or name them from satellite imagery. Five modes, ten rounds each."
    />

    <!-- Link previews (Open Graph / Twitter). No og:image: the only images in
         the project are 1280px satellite tiles, which make a poor thumbnail. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Omni Geo Quiz" />
    <meta
      property="og:description"
      content="Find US states, cities and airports on a blank map, or name them from satellite imagery."
    />
    <meta property="og:url" content="https://jiaming-sun-900.github.io/omni-geo-quiz/" />
    <meta name="twitter:card" content="summary" />
    <script type="module" crossorigin src="/omni-geo-quiz/assets/index-BXx2evCx.js"></script>
    <link rel="stylesheet" crossorigin href="/omni-geo-quiz/assets/index-MaocHPWg.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
